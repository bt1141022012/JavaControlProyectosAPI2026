services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: control_proyectos
      MYSQL_USER: control_proyectos
      MYSQL_PASSWORD: "#2026@1021"
      MYSQL_ROOT_PASSWORD: "#2026@1021"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  admin-bootstrap:
    image: mysql:8.4
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_DATABASE: control_proyectos
      MYSQL_PWD: "#2026@1021"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/bin/sh", "-c"]
    command: ["exec mysql -h host.docker.internal -uroot \"$$MYSQL_DATABASE\" < /seed-admin.sql"]
    volumes:
      - ./database/seed-admin.sql:/seed-admin.sql:ro
    restart: "no"

  api:
    image: control-proyectos-api:local
    build:
      context: .
      dockerfile: .dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      admin-bootstrap:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://host.docker.internal:3306/control_proyectos?useSSL=false&allowPublicKeyRetrieval=true"
    ports:
      - "8080:8080"
    restart: unless-stopped

  newman:
    image: control-proyectos-newman:local
    build:
      context: .
      dockerfile: postman/Dockerfile
    profiles: ["test"]
    depends_on:
      api:
        condition: service_started
    environment:
      NEWMAN_ADMIN_PASSWORD: ${NEWMAN_ADMIN_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./postman:/etc/newman:ro
      - ./postman:/reports
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$NEWMAN_ADMIN_PASSWORD" ]; then
          echo "Set NEWMAN_ADMIN_PASSWORD in your shell or .env file before running Newman" >&2
          exit 2
        fi
        attempt=0
        until node -e "const http=require('http');const req=http.get('http://host.docker.internal:8080/v3/api-docs',r=>{r.resume();process.exit(r.statusCode===200?0:1)});setTimeout(()=>{req.destroy();process.exit(1)},2000);req.on('error',()=>process.exit(1))"; do
          attempt=$$((attempt + 1))
          if [ "$$attempt" -ge 30 ]; then
            echo "API did not become ready within 120 seconds" >&2
            exit 1
          fi
          sleep 2
        done
        exec newman run /etc/newman/GestiondeProyectosAPI.postman_collection.json \
          --env-var baseUrl=http://host.docker.internal:8080 \
          --env-var "adminPassword=$$NEWMAN_ADMIN_PASSWORD" \
          --timeout-request 15000 \
          --reporters cli,junit,htmlextra \
          --reporter-junit-export /reports/newman.xml \
          --reporter-htmlextra-export /reports/newman-report.html
    restart: "no"

volumes:
  mysql_data:
