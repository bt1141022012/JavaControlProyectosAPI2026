services:
  k6:
    image: grafana/k6:0.56.0
    user: "0:0"
    depends_on:
      api:
        condition: service_started
    environment:
      BASE_URL: http://host.docker.internal:8080
      K6_VUS: ${K6_VUS:-50}
      K6_CATEGORIES_PER_VU: ${K6_CATEGORIES_PER_VU:-10}
      K6_HOLD_SECONDS: ${K6_HOLD_SECONDS:-0}
      K6_WEB_DASHBOARD: "true"
      K6_WEB_DASHBOARD_HOST: 0.0.0.0
      K6_WEB_DASHBOARD_PORT: "5665"
      K6_WEB_DASHBOARD_EXPORT: /reports/k6-report.html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5665:5665"
    volumes:
      - ./k6:/scripts:ro
      - ./k6/reports:/reports
    command: ["run", "/scripts/smoke.js"]
    restart: "no"